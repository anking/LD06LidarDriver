name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --project LD06_Driver.Tests/LD06_Driver.Tests.csproj -c Release

      - name: Publish for the Raspberry Pi
        run: |
          for rid in linux-arm64 linux-arm; do
            dotnet publish LD06_Driver.csproj -c Release --self-contained -r "$rid" -o "publish/$rid"
            (cd "publish/$rid" && zip -r "../$rid.zip" .)
          done

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" publish/linux-arm64.zip publish/linux-arm.zip --clobber
